# Next/Previous windows: Alt + (Shift +) + n
bind-key -n M-n next-window
bind-key -n M-N previous-window
# Interactive session selection: Alt + Tab
bind-key -n M-Tab choose-session
# Kill pane: Alt + -
bind-key -n M-- kill-pane
# Kill window: Alt + Shift + -
bind-key -n M-+ kill-window
# Toggle fullscreen: Alt + f
bind-key -n M-f resize-pane -Z
# Cycle layouts: Alt + g
bind-key -n M-g next-layout
# Even-horizontal layout: Alt + c
bind-key -n M-c select-layout even-horizontal
# Main-horizontal layout: Alt + r
bind-key -n M-r select-layout main-horizontal
# Next/Previous panes: Alt + (Shift +) w
bind-key -n M-w select-pane -t :.+
bind-key -n M-W last-pane
# Enter resize mode: Alt + i
bind-key -n M-I switch-client -T resize-mode
# Resize with vim keys in resize mode
bind-key -T resize-mode h resize-pane -L 5
bind-key -T resize-mode j resize-pane -D 5
bind-key -T resize-mode k resize-pane -U 5
bind-key -T resize-mode l resize-pane -R 5
# Exit resize mode: Esc or q
bind-key -T resize-mode Escape switch-client -T root
bind-key -T resize-mode q switch-client -T root
