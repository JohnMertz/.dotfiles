set -g mouse on
set -g history-limit 500000
bind-key -n M-e split-window -h
bind-key -n M-u split-window -v
# Switch between panes: Alt + vim navigation keys
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
# Also allow arrow keys to switch panes: Alt + arrow keys
bind-key -n M-Left  select-pane -L
bind-key -n M-Down  select-pane -D
bind-key -n M-Up    select-pane -U
bind-key -n M-Right select-pane -R
# Swap pane positions: Alt + Shift + vim navigation keys
#bind-key -n M-H rotate-window -L
#bind-key -n M-L rotate-window -R
bind-key -n M-J rotate-window -D
bind-key -n M-K rotate-window -U
#bind-key -n M-H swap-pane -L
#bind-key -n M-J swap-pane -D
#bind-key -n M-K swap-pane -U
#bind-key -n M-L swap-pane -R
# Switch between windows (create if they don't exist): Alt + N
bind-key -n M-0 run-shell '
session=$(tmux display-message -p "#{session_name}")
if tmux has-window -t "$session:0" 2>/dev/null; then
  tmux select-window -t "$session:0"
else
  tmux new-window -t "$session:0" -n 0
  tmux select-window -t "$session:0"
fi
'
